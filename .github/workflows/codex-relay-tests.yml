name: Codex Relay - offline tests
on:
  push:
    paths: ['portfolio_autopilot/codex_relay/**', '.github/workflows/codex-relay-tests.yml']
  pull_request:
    paths: ['portfolio_autopilot/codex_relay/**', '.github/workflows/codex-relay-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mock integrations only - no credentials or inference
        run: python -m unittest discover -s portfolio_autopilot/codex_relay/tests -v
