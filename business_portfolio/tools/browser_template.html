<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Portfolio</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#26323b;background:#f7f8fa;--accent:#236758;--line:#e1e5e9;--muted:#65717d}*{box-sizing:border-box}body{margin:0}button,input,summary,a{font:inherit}button,a,input,summary{outline-offset:4px}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px}header{padding:23px 30px;border-bottom:1px solid var(--line);background:white;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}header h1{font-size:20px;font-weight:650;letter-spacing:-.5px;margin:0}#sync{font-size:12px;color:var(--muted);max-width:650px}#sync.warning{color:#8a4d19}.workspace{max-width:1500px;margin:auto;display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start}.projects{padding:25px 18px}.search{width:100%;border:1px solid #cbd2d9;padding:12px 14px;border-radius:9px;background:#fff;font-size:14px}.projects h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:25px 9px 12px}.folder{margin:3px 0}.folder>summary{font-size:13px;font-weight:600;padding:10px 7px;cursor:pointer;overflow-wrap:anywhere}.children{margin-left:12px;border-left:1px solid var(--line);padding-left:8px}.project{border:0;background:transparent;width:100%;display:flex;text-align:left;flex-direction:column;gap:4px;border-radius:7px;padding:10px 12px;margin:2px 0;font-size:13px;color:inherit;line-height:1.4}.project:hover{background:#eaf0ef}.project[aria-current=true]{background:#e2eee9;color:#164c40}.status{font-size:11px;color:var(--muted)}#detail{padding:38px 44px 70px;background:white;border-left:1px solid var(--line);min-height:calc(100vh - 75px);min-width:0;overflow-wrap:anywhere}#detail h1{font-size:30px;letter-spacing:-.8px;margin:0 0 14px;line-height:1.2}#detail h2{font-size:19px;letter-spacing:-.2px;margin:31px 0 12px}#detail h3{font-size:15px;margin:20px 0 8px}p,li{font-size:14px;line-height:1.75}p{margin:10px 0}.description{font-size:16px;line-height:1.7;max-width:850px;color:#465660}.next{padding:17px 20px;border-left:3px solid var(--accent);background:#f0f6f3;border-radius:0 8px 8px 0}.next h2{margin:0 0 7px!important;font-size:15px!important}.next p{margin:0}.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}.progress h3{font-size:13px!important;color:var(--muted)}.progress ul{padding-left:20px}.muted,.empty{color:var(--muted);font-size:13px;line-height:1.7}.empty{padding:20px 8px}details.extra{margin:20px 0;border-top:1px solid var(--line);padding-top:16px}details.extra>summary{cursor:pointer;font-size:14px;font-weight:600}code{background:#f0f2f4;padding:2px 4px;border-radius:3px;font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#f5f6f8;padding:15px;border-radius:7px}pre code{background:none;padding:0}ul,ol{padding-left:23px}.result{padding:11px 0;border-bottom:1px solid #eef0f2}.result small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.instructions{max-width:950px}.instructions>h1{font-size:21px!important}.source{font-size:12px;color:var(--muted);margin:12px 0}.project-id{font-size:11px;color:var(--muted);margin-top:30px}table{display:block;overflow:auto;border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--line);padding:9px;min-width:80px;text-align:left}#recent:empty{display:none}.note{border-radius:7px;padding:12px 15px;background:#f7f8fa;font-size:13px}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #74b7a3}@media(max-width:760px){header{padding:20px}.workspace{grid-template-columns:1fr}.projects{padding:18px}#detail{border-left:0;border-top:1px solid var(--line);padding:26px 21px 55px}#detail h1{font-size:25px}.projects h2{margin-top:18px}.progress{grid-template-columns:1fr}.children{margin-left:8px}}@media print{header,.projects,#sync{display:none}.workspace{display:block}#detail{border:0;padding:0}.extra{display:block}}
</style></head><body><header><h1>Business Portfolio</h1><span id="sync" role="status">Snapshot — double-click Open_Project_Browser.cmd for live updates.</span></header>
<div class="workspace"><aside class="projects" aria-label="Project navigation"><input class="search" id="q" aria-label="Search projects" placeholder="Search projects…" type="search" autocomplete="off"><div id="recent"></div><h2>Projects</h2><nav id="tree" aria-label="Project folders"></nav></aside><main id="detail" aria-live="polite"></main></div>
<script id="portfolio-data" type="application/json">/*__PORTFOLIO_DATA__*/</script>
<script>
'use strict';
let DATA=JSON.parse(document.getElementById('portfolio-data').textContent), selected=decodeURIComponent(location.hash.slice(1)), search='', expanded=new Set(), version='', polling=false, live=false;
const $=id=>document.getElementById(id), label=s=>String(s||'').replaceAll('_',' '), el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}, clear=e=>e.replaceChildren();
const states={planned:'Not started',deferred:'Deferred',active:'Active',blocked:'Needs attention',ready_for_test:'Ready to test',completed:'Complete',cancelled:'Cancelled',archived:'Archived',paused:'Paused',published_reported:'Published',operational_reported:'In use',prototype_reported:'Prototype',legacy_preserved:'Legacy · preserved',needs_reconciliation:'Needs review',package_ready:'Ready to integrate'};
function safeURL(value,base=''){try{if(/^(https?:)/i.test(value)){const u=new URL(value);return u.username||u.password?null:u.href}if(/^[a-z][a-z0-9+.-]*:/i.test(value)||value.startsWith('//')||value.includes('\\'))return null;const u=new URL(value,new URL(base||'.',location.href));return u.origin===location.origin||location.protocol==='file:'&&u.protocol==='file:'?u.href:null}catch{return null}}
function inline(parent,text,base=''){let re=/\[([^\]]+)\]\(([^)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*/g,last=0,m;while((m=re.exec(text))){parent.append(document.createTextNode(text.slice(last,m.index)));if(m[1]){const href=safeURL(m[2],base);const a=el(href?'a':'span',m[1]);if(href){a.href=href;if(/^https?:/.test(href)&&new URL(href).origin!==location.origin){a.target='_blank';a.rel='noopener noreferrer'}}parent.append(a)}else parent.append(el(m[3]?'code':'strong',m[3]||m[4]));last=re.lastIndex}parent.append(document.createTextNode(text.slice(last)))}
function markdown(parent,text,base=''){let code=false,pre=null,list=null;for(const line of text.split('\n')){if(line.startsWith('```')){code=!code;if(code){pre=el('pre');parent.append(pre)}continue}if(code){pre.append(document.createTextNode(line+'\n'));continue}if(!line.trim()){list=null;continue}const h=line.match(/^(#{1,6}) +(.+)$/),li=line.match(/^\s*(?:[-*] |\d+[.)] )(.+)$/);let e;if(h){e=el('h'+Math.min(3,h[1].length));list=null;inline(e,h[2],base);parent.append(e)}else if(li){if(!list){list=el('ul');parent.append(list)}e=el('li');inline(e,li[1],base);list.append(e)}else{list=null;e=el('p');inline(e,line,base);parent.append(e)}}}
function sections(body){const parts=[];let current={heading:'',body:[]};for(const line of body.split('\n')){const h=line.match(/^## +(.+)$/);if(h){parts.push(current);current={heading:h[1],body:[]}}else current.body.push(line)}parts.push(current);return parts.map(s=>({...s,text:s.body.join('\n')}))}
function checks(body,done){return body.split('\n').map(l=>l.match(/^\s*- \[([ xX])\] (.+)$/)).filter(Boolean).filter(m=>(m[1].toLowerCase()==='x')===done).map(m=>m[2].replace(/; SHA-256 [a-f0-9]{64}\.?/i,''))}
function listGroup(parent,title,items,empty){const box=el('div');box.append(el('h3',title));if(items.length){const ul=el('ul');for(const item of items){const li=el('li');inline(li,item);ul.append(li)}box.append(ul)}else box.append(el('p',empty,'muted'));parent.append(box)}
function showProject(id,scroll=false){const r=DATA.records.find(r=>r.id===id);clear($('detail'));if(!r){$('detail').append(el('h1','Project unavailable'),el('p','This project was moved outside the portfolio or removed. The saved records remain the source of truth.','muted'));return}selected=id;history.replaceState(null,'','#'+encodeURIComponent(id));const d=$('detail');d.append(el('h1',r.title));const ss=sections(r.body), outcome=r.body.match(/\*\*Problem\/outcome:\*\* ([^\n]+)/), bounded=ss.find(s=>/Bounded deliverable/i.test(s.heading));let description=outcome?.[1]||bounded?.text.trim()||({'EX-001':'A spreadsheet for a cleaning business to estimate a quote from its own labor, travel, supply and cost assumptions.','EX-002':'A single-item spreadsheet for comparing current stock with a reorder threshold and showing the gap. It does not optimize purchasing.','EX-007':'A local connection between official Codex and browser or desktop actions within the access you grant.'}[r.id])||({'existing_product':'An existing digital product. Preserve the approved release and build on its saved work.','existing_internal_tool':'An existing internal tool. Preserve its architecture and permissions.','current_system_project':'The local project system that keeps these saved records usable.'}[r.record_type])||'This project preserves the scope, decisions and next action recorded below.';d.append(el('p',description,'description'));if(r.commercial_validation==='published_unvalidated')d.append(el('p','Published. Paid customer demand and charged-payment processing remain unverified.','note'));const next=el('section',undefined,'next');next.append(el('h2','Next step'),el('p',r.next_action));d.append(next);d.append(el('h2','Progress'));const pg=el('section',undefined,'progress');listGroup(pg,'Completed',checks(r.body,true),'No completed tasks recorded.');listGroup(pg,'In progress',r.work_state==='active'?[r.next_action]:[],r.work_state==='active'?'':'No current task recorded as active.');listGroup(pg,'Remaining',checks(r.body,false),'No remaining checklist recorded. See the instructions and next step.');d.append(pg);d.append(el('p','Current status: '+(states[r.work_state]||label(r.work_state))+'. Checkmarks retain the evidence limits recorded in the instructions.','muted'));
d.append(el('h2','Files & Results'));const results=DATA.deliverables?.[r.id]||[],fileBox=el('section');for(const f of results){const line=el('div',undefined,'result');if(f.url){const a=el('a',f.label),url=safeURL(f.url);if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer';line.append(a)}}else if(f.available&&live){const a=el('a',f.label);a.href='/files/'+encodeURIComponent(f.key);line.append(a)}else line.append(el('span',f.label));line.append(el('small',f.note||f.kind||'Document'));fileBox.append(line)}if(!results.length)fileBox.append(el('p','No accessible deliverable has been verified for this record. Planned outputs in the instructions are not finished files.','muted'));d.append(fileBox);if(!live)d.append(el('p','Local files are checked by the live launcher. Private releases and protected folders are not exposed.','muted'));
d.append(el('h2','Instructions'));const ins=el('section',undefined,'instructions');for(const s of ss){if(!s.heading){continue}if(/evidence|economics|budget|marketing|sales plan|source|revision|efficiency|research|acquisition|progress checkpoint|current position|local reconciliation|completed work|remaining work|resume checkpoint|important decisions|work log/i.test(s.heading)){const ex=el('details',undefined,'extra');ex.append(el('summary',s.heading));markdown(ex,s.text,r.path);ins.append(ex)}else{ins.append(el('h3',s.heading));markdown(ins,s.text,r.path)}}d.append(ins);const extra=el('details',undefined,'extra');extra.append(el('summary','Research, sources & planning details'));const references=el('div');for(const sid of r.source_ids){const s=DATA.sources.find(s=>s.id===sid);if(!s)continue;const para=el('p'),url=safeURL(s.url),a=el(url?'a':'span',s.title);if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}para.append(a,el('small',' — '+s.access+'; '+(s.limitations||''),'source'));references.append(para)}extra.append(references);extra.append(el('p','Owner spending authorized: CAD'+(r.owner_budget?.authorized_spend??0)+'. Planning ceiling: CAD'+(r.owner_budget?.hard_ceiling??100)+'. A ceiling is not permission.','muted'));for(const doc of DATA.documents||[]){const ex=el('details',undefined,'extra');ex.append(el('summary',doc.title));markdown(ex,doc.body,doc.path);extra.append(ex)}d.append(extra);const raw=el('details',undefined,'extra');raw.append(el('summary','Complete original record'));markdown(raw,r.body,r.path);d.append(raw,el('p',r.id+' · '+r.path,'project-id'));document.querySelectorAll('.project').forEach(e=>e.setAttribute('aria-current',String(e.dataset.id===id)));if(scroll&&matchMedia('(max-width:760px)').matches)d.scrollIntoView({block:'start'});}
function projectButton(r){const b=el('button',undefined,'project');b.type='button';b.dataset.id=r.id;b.setAttribute('aria-current',String(selected===r.id));b.append(el('span',r.title),el('span',states[r.work_state]||label(r.work_state),'status'));b.onclick=()=>showProject(r.id,true);return b}
function tree(){clear($('tree'));clear($('recent'));const q=search.toLowerCase().trim(),rows=DATA.records.filter(r=>!q||[r.title,r.id,r.body,r.next_action].some(s=>String(s).toLowerCase().includes(q)));if(!rows.length){$('tree').append(el('p','No matching projects. Try another name or clear the search.','empty'));return}if(!q){const recent=[...rows].sort((a,b)=>Number(b.work_state==='active')-Number(a.work_state==='active')||Number(b.recently_saved_at||0)-Number(a.recently_saved_at||0)).filter(r=>r.work_state==='active'||r.recently_saved_at).slice(0,4);if(recent.length){$('recent').append(el('h2','Recently saved & active'));recent.forEach(r=>$('recent').append(projectButton(r)))}}
const nodes=new Map(DATA.niches.map(n=>[n.path,{...n,children:[],records:[]}])) ;for(const r of rows)nodes.get(r.niche_path)?.records.push(r);const roots=[];for(const n of nodes.values()){const parent=n.path.includes('/')?nodes.get(n.path.slice(0,n.path.lastIndexOf('/'))):null;if(parent)parent.children.push(n);else roots.push(n)}const visible=n=>n.records.length||n.children.some(visible);function add(parent,n){if(!visible(n))return;const folder=el('details',undefined,'folder');folder.dataset.niche=n.id;folder.open=Boolean(q)||expanded.has(n.id);const s=el('summary',n.title);folder.append(s);const children=el('div',undefined,'children');n.records.sort((a,b)=>a.title.localeCompare(b.title)).forEach(r=>children.append(projectButton(r)));n.children.sort((a,b)=>a.title.localeCompare(b.title)).forEach(c=>add(children,c));folder.append(children);folder.ontoggle=()=>{if(folder.open)expanded.add(n.id);else expanded.delete(n.id)};parent.append(folder)}roots.sort((a,b)=>a.title.localeCompare(b.title)).forEach(n=>add($('tree'),n));}
function update(data){const oldScroll=window.scrollY,opened=[...document.querySelectorAll('#detail details[open]')].map(e=>e.querySelector('summary')?.textContent);DATA=data;tree();showProject(selected||DATA.records[0]?.id);document.querySelectorAll('#detail details').forEach(e=>{if(opened.includes(e.querySelector('summary')?.textContent))e.open=true});window.scrollTo(0,oldScroll)}
$('q').addEventListener('input',()=>{search=$('q').value;tree()});for(const n of DATA.niches)if(!n.parent)expanded.add(n.id);if(!DATA.records.some(r=>r.id===selected))selected=DATA.records.find(r=>r.id==='EX-001')?.id||DATA.records[0]?.id;for(const n of DATA.niches)if(DATA.records.find(r=>r.id===selected)?.niche_path.startsWith(n.path))expanded.add(n.id);tree();showProject(selected);
async function poll(){if(polling)return;polling=true;try{const state=await fetch('/api/state',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});live=true;if(state.version!==version){const d=await fetch('/api/portfolio',{cache:'no-store'}).then(r=>r.json());version=state.version;update(d)}$('sync').textContent=state.warning?'Some edits are incomplete. Showing the last valid saved state.':'Live · changes appear automatically';$('sync').classList.toggle('warning',Boolean(state.warning))}catch{$('sync').textContent='Connection paused · showing the last saved view. Reopen Open_Project_Browser.cmd if needed.';$('sync').classList.add('warning')}finally{polling=false}}
if(location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname)){poll();setInterval(poll,1200)}
</script></body></html>
