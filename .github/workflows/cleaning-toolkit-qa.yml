name: Cleaning calculator - offline artifact QA
on:
  push:
    paths:
      - 'products/cleaning-pricing-calculator/**'
      - '.github/workflows/cleaning-toolkit-qa.yml'
  pull_request:
    paths:
      - 'products/cleaning-pricing-calculator/**'
      - '.github/workflows/cleaning-toolkit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent formula, archive and privacy tests
        run: python -m unittest discover -s products/cleaning-pricing-calculator/tests -v
      - name: Verify release ZIP against source hashes (read-only)
        run: python products/cleaning-pricing-calculator/tools/package_release.py --check
